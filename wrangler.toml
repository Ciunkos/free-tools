name = "free-tools"
main = "_worker.js"
compatibility_date = "2026-09-01"

# Free tools under ciunkos.com paths: /free-tools/<tool> (EN) and /darmowe-narzedzia/<tool> (PL).
# Assets, sitemap, llms.txt and the health API sit under /free-tools too. build.mjs checks these prefixes against src/meta.mjs.
routes = [
  { pattern = "ciunkos.com/free-tools*", zone_name = "ciunkos.com" },
  { pattern = "www.ciunkos.com/free-tools*", zone_name = "ciunkos.com" },
  { pattern = "ciunkos.com/darmowe-narzedzia*", zone_name = "ciunkos.com" },
  { pattern = "www.ciunkos.com/darmowe-narzedzia*", zone_name = "ciunkos.com" }
]
workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[observability]
enabled = true
head_sampling_rate = 1
